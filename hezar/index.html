<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hezar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="progress-wrapper">
            <div class="progress-ring">
                <svg class="progress-ring-svg" width="220" height="220">
                    <circle class="progress-ring-circle-bg" cx="110" cy="110" r="100" stroke-width="3"></circle>
                    <circle class="progress-ring-circle" cx="110" cy="110" r="100" stroke-width="2"></circle>
                </svg>
            </div>
            <button id="mainButton" class="button-1" role="button">
                <span class="button-1-shadow"></span>
                <span class="button-1-edge"></span>
                <span class="button-1-front text">
                    Hezar
                </span>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
