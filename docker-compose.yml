# Full stack: PostgreSQL + Express API + Next.js. Configure via a root .env (see .env.example).
name: chth

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-merch_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-merch_platform}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      HUB_URL: ${HUB_URL:-}
      HUB_SECRET: ${HUB_SECRET:-}
      SHOP_CURRENCY: ${SHOP_CURRENCY:-USD}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      # Optional HTTP proxy for outgoing calls (OAuth token exchange etc.), see OUTBOUND_PROXY in .env.example.
      NODE_USE_ENV_PROXY: ${OUTBOUND_PROXY:+1}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,frontend
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-nowpayments}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-25}
      TON_NETWORK: ${TON_NETWORK:-mainnet}
      TON_RECEIVER_ADDRESS: ${TON_RECEIVER_ADDRESS:-}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      TON_USD_PRICE: ${TON_USD_PRICE:-}
      TON_WALLET_MNEMONIC: ${TON_WALLET_MNEMONIC:-${TON_MINTER_MNEMONIC:-}}
      TON_USDT_MASTER: ${TON_USDT_MASTER:-}
      PAYOUT_HOLD_DAYS: ${PAYOUT_HOLD_DAYS:-14}
      PAYOUT_MIN_USD: ${PAYOUT_MIN_USD:-10}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      TELEGRAM_MINI_APP_NAME: ${TELEGRAM_MINI_APP_NAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TON_NFT_COLLECTION_ADDRESS: ${TON_NFT_COLLECTION_ADDRESS:-}
      REFERRAL_DISCOUNT_PERCENT: ${REFERRAL_DISCOUNT_PERCENT:-10}
      REFERRAL_REWARD_PERCENT: ${REFERRAL_REWARD_PERCENT:-5}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:5000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_TELEGRAM_MINI_APP_LINK: ${TELEGRAM_MINI_APP_LINK:-}
    restart: unless-stopped
    # HTTPS when certs/localhost.pem and certs/localhost-key.pem exist (see .env.example), else HTTP.
    environment:
      TLS_CERT_FILE: /app/certs/localhost.pem
      TLS_KEY_FILE: /app/certs/localhost-key.pem
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
