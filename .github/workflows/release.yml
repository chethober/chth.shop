name: Release

# Publishes the backend and frontend images to GitHub Container Registry:
#   ghcr.io/<owner>/chth-backend   ghcr.io/<owner>/chth-frontend
# Every push to main that changes the shop is a release: vX.Y.Z, the patch number raised by each
# (raise "version" in backend/package.json to start a new minor or major). Its images are tagged
# `1.2.3`, `latest`, `edge` and `sha-<short>`, and it gets a GitHub release, which the CHTH hub
# posts to the updates channel. A version tag pushed by hand (v1.2.3) is published the same way.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the tags, the notes from the commits since
      - name: Work out the version
        id: plan
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_PACKAGE: backend/package.json
          RELEASE_EXCLUDE: .specify
        run: node .github/scripts/release.mjs plan

  images:
    needs: version
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chth-${{ matrix.service }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version || 'edge' }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  release:
    name: Release
    if: needs.version.outputs.release == 'true'
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: backend/package.json
          RELEASE_EXCLUDE: .specify
          RELEASE_TITLE: CHTH Shop
        run: node .github/scripts/release.mjs publish
