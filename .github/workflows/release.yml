name: Release

# Publishes the backend and frontend images to GitHub Container Registry:
#   ghcr.io/<owner>/chth-backend   ghcr.io/<owner>/chth-frontend
# Pushes to main are tagged `edge` + `sha-<short>`; version tags (v1.2.3) are tagged
# `1.2.3`, `1.2`, `latest`, and also get a GitHub release with generated notes.
# Either way the notes are posted to the CHTH updates channel through the hub.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chth-${{ matrix.service }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  # A push to main is announced as <backend version>-<date>.<commit>, a version tag by its name.
  announce:
    name: Announce release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release post lists the commits since the last push or tag

      - name: Announce release
        env:
          CHTH_HUB_URL: ${{ secrets.CHTH_HUB_URL }}
          CHTH_RELEASE_SECRET: ${{ secrets.CHTH_RELEASE_SECRET }}
          RELEASE_PRODUCT: shop
          RELEASE_PACKAGE: backend/package.json
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          RELEASE_BASE: ${{ github.event.before }}
          RELEASE_EXCLUDE: .specify
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/${{ startsWith(github.ref, 'refs/tags/') && format('releases/tag/{0}', github.ref_name) || format('commits/{0}', github.sha) }}
        run: node .github/scripts/announce-release.mjs
