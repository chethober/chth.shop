name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn workspace chth-frontend tsc --noEmit -p .

      - name: Build
        run: yarn workspace chth-frontend build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    # Non-blocking for now: a few components in frontend/components/custom still trip the
    # React Compiler `react-hooks/*` rules. Remove this line once `yarn workspace chth-frontend lint` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn workspace chth-frontend lint

  backend:
    name: Backend (schema + syntax)
    runs-on: ubuntu-latest
    env:
      # Only used to satisfy `prisma validate`; nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Prisma schema
        run: yarn workspace chth-backend prisma validate

      - name: Generate Prisma client
        run: yarn workspace chth-backend prisma:generate

      - name: Check JavaScript syntax
        run: find backend/server.js backend/src backend/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate compose file
        run: docker compose config --quiet
        env:
          JWT_SECRET: ci
          SESSION_SECRET: ci
